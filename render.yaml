services:
  - type: web
    name: skin-disease-detection
    runtime: python
    buildCommand: "bash build.sh"
    startCommand: "cd backend && gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: PORT
        value: 10000
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        value: "your-secret-key-change-in-render-dashboard"
      - key: ALLOWED_HOSTS
        value: "your-render-url.onrender.com,localhost,127.0.0.1"
